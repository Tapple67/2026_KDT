<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    /* practice2 */
        <div>
            카테고리
            <select>
                <option value="1">공지사항</option>
                <option value="2">게시글</option>
            </select>
            <br/>
            <input type="text" name="작성자" placeholder="작성자">
            <input type="password" name="비밀번호" placeholder="비밀번호">
            <hr/>
            <input type="text" name="게시물 제목 입력" placeholder="게시물 제목 입력">
            <hr/>
            <input type="text" name="게시물 내용 입력" placeholder="게시물 내용 입력" style= "width:500px; height:300px;">
            <br/>

            공개선택 
            <input type="radio" name="글" value="1" id="공개글">
            <label for="공개글">공개글</label>
            <input type="radio" name="글" value="2" id="비공개글">
            <label for="비공개글">비공개글</label>
            <br/>

            공유 선택
            <input type="checkbox" name="공유" value="1" id="카카오톡">
            <label for="카카오톡">카카오톡</label>
            <input type="checkbox" name="공유" value="2">
            <label for="트위터">트위터</label>
            <input type="checkbox" name="공유" value="3">
            <label for="네이버카페">네이버카페</label>
            <br/>
            작성일자
            <input type="date" name="작성">
            작성시간<input type="time" name="작성">
            <br/>
            <hr>
            첨부파일
            <input type="button" name="파일선택" value="파일선택">선택된파일 없음
            <br>
            <br/>
            <input type="button" value="목록보기">
            
            <input type="button" value="글쓰기">
            
            <input type="button" value="다시쓰기">
            


        </div>
</body>
